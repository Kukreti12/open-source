apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: learn-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Kukreti12/open-source.git
    targetRevision: master
    path: helm/api
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true