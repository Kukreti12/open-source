replicaCount: 1

image:
  repository: open-source-ui
  tag: latest
  pullPolicy: Never  # Using local Docker image

service:
  type: NodePort
  port: 3000
  targetPort: 3000
  nodePort: 30000  # Accessible at http://localhost:30000
  name: ui

app:
  name: ui

# Environment variables
env:
  NEXT_PUBLIC_API_URL: "http://fastapi:8000"

resources:
  limits:
    cpu: "500m"
    memory: "512Mi"
  requests:
    cpu: "250m"
    memory: "256Mi"

# Health checks
livenessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 10
  periodSeconds: 10

readinessProbe:
  enabled: true
  path: /
  initialDelaySeconds: 5
  periodSeconds: 5
